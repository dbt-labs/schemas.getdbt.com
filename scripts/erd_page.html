<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dbt info schema ERD: __NAME__</title>
  <style>
    body {
      background: #003645 !important;
      color: #93a1a1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      color: #fff;
      margin: .4em 0;
    }

    a {
      color: #93a1a1;
      text-decoration: none;
    }

    a:hover {
      color: #fff;
    }

    nav {
      font-size: 120%;
      margin: 1em 0;
    }

    nav a {
      margin: 0 .6em;
    }

    nav a[aria-current] {
      color: #fff;
      font-weight: bold;
    }

    #diagram {
      background: #002b36;
      border: 1px solid #0f5566;
      border-radius: 6px;
      height: calc(100vh - 270px);
      min-height: 420px;
      overflow: hidden;
      position: relative;
      text-align: left;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: absolute;
      right: 12px;
      top: 12px;
      z-index: 2;
    }

    .controls button,
    .controls a {
      align-items: center;
      background: #003645;
      border: 1px solid #93a1a1;
      border-radius: 4px;
      box-sizing: border-box;
      color: #93a1a1;
      cursor: pointer;
      display: flex;
      font: inherit;
      font-size: 16px;
      height: 34px;
      justify-content: center;
      line-height: 1;
      padding: 0;
      width: 34px;
    }

    .controls button:hover,
    .controls a:hover {
      border-color: #fff;
      color: #fff;
    }

    .hint {
      bottom: 10px;
      font-size: 80%;
      left: 14px;
      margin: 0;
      pointer-events: none;
      position: absolute;
      z-index: 2;
    }

    #diagram:fullscreen {
      border: 0;
      border-radius: 0;
      height: 100vh;
    }

    #diagram svg {
      display: block;
      height: 100%;
      width: 100%;
    }

    .mermaid {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    /* Hollow "zero" markers; Mermaid draws them white. */
    #diagram marker circle {
      fill: #002b36 !important;
      stroke: #93a1a1 !important;
    }
  </style>
</head>

<body>
  <a href="__UP__index.html"><img src="__UP__static/dbt-logo-full-white.svg" width="150" alt="dbt"></a>
  <h1>Info Schema ERD: __NAME__</h1>
  <nav>__NAV__</nav>

  <div id="diagram">
    <div class="controls">
      <button id="zoom-in" title="Zoom in (+)" aria-label="Zoom in">+</button>
      <button id="zoom-out" title="Zoom out (-)" aria-label="Zoom out">&minus;</button>
      <button id="fit" title="Fit to window (0)" aria-label="Fit to window">&#8982;</button>
      <button id="fullscreen" title="Full screen (f)" aria-label="Full screen">&#9974;</button>
      <button id="download" title="Download as SVG" aria-label="Download as SVG">&#8681;</button>
      <a href="__RAW__" title="Raw .mmd" aria-label="Raw .mmd">&lt;/&gt;</a>
    </div>
    <p class="hint">Scroll to zoom. Drag to pan.</p>
    <pre class="mermaid">
__SOURCE__</pre>
  </div>

  <script src="__PANZOOM_URL__"></script>
  <script type="module">
    import mermaid from "__MERMAID_URL__";

    mermaid.initialize({
      startOnLoad: false,
      maxTextSize: 1000000,
      theme: "base",
      themeVariables: {
        background: "#002b36",
        primaryColor: "#0b4a5c",
        primaryBorderColor: "#93a1a1",
        primaryTextColor: "#ffffff",
        secondaryColor: "#0b4a5c",
        tertiaryColor: "#002b36",
        lineColor: "#93a1a1",
        textColor: "#93a1a1",
        attributeBackgroundColorOdd: "#00414f",
        attributeBackgroundColorEven: "#003645",
        fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      }
    });
    await mermaid.run({ querySelector: ".mermaid" });

    const box = document.getElementById("diagram");
    const svg = box.querySelector("svg");
    svg.removeAttribute("style");
    svg.setAttribute("width", "100%");
    svg.setAttribute("height", "100%");

    const pz = svgPanZoom(svg, {
      zoomEnabled: true,
      mouseWheelZoomEnabled: true,
      dblClickZoomEnabled: true,
      controlIconsEnabled: false,
      fit: true,
      center: true,
      minZoom: 0.05,
      maxZoom: 30,
      zoomScaleSensitivity: 0.3
    });
    const refit = () => { pz.resize(); pz.fit(); pz.center(); };
    // The first fit runs before the page layout settles.
    requestAnimationFrame(() => setTimeout(refit, 50));

    document.getElementById("zoom-in").onclick = () => pz.zoomIn();
    document.getElementById("zoom-out").onclick = () => pz.zoomOut();
    document.getElementById("fit").onclick = refit;
    document.getElementById("fullscreen").onclick = () =>
      document.fullscreenElement ? document.exitFullscreen() : box.requestFullscreen();
    document.getElementById("download").onclick = () => {
      const copy = svg.cloneNode(true);
      copy.querySelector(".svg-pan-zoom_viewport")?.removeAttribute("transform");
      const blob = new Blob([new XMLSerializer().serializeToString(copy)], { type: "image/svg+xml" });
      const a = Object.assign(document.createElement("a"), {
        href: URL.createObjectURL(blob),
        download: "info-schema-erd-__NAME__.svg"
      });
      a.click();
      URL.revokeObjectURL(a.href);
    };
    document.addEventListener("keydown", (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "+" || e.key === "=") pz.zoomIn();
      else if (e.key === "-") pz.zoomOut();
      else if (e.key === "0") refit();
      else if (e.key === "f") document.getElementById("fullscreen").click();
    });
    document.addEventListener("fullscreenchange", () => setTimeout(refit, 50));
    window.addEventListener("resize", refit);
  </script>
</body>

</html>
