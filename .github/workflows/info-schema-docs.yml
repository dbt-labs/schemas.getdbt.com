name: Build info schema docs

# `dbt/info-schema/**/*.json` and `*.mmd` are synced from dbt-labs/fs. After a
# sync merges, build the HTML from them and open a follow-up PR (main is
# protected). The path filter lists only the raw inputs, so merging that PR
# does not trigger this workflow again.
on:
  push:
    branches:
      - main
    paths:
      - 'dbt/info-schema/**/*.json'
      - 'dbt/info-schema/**/*.mmd'
      - 'scripts/build_info_schema.py'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: info-schema-docs
  cancel-in-progress: false

jobs:
  build:
    name: Build HTML and open PR
    if: github.repository == 'dbt-labs/schemas.getdbt.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install json-schema-for-humans
        run: pip install json-schema-for-humans==1.5.1

      - name: Build HTML
        run: python scripts/build_info_schema.py

      - name: Open PR if the HTML changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "HTML is up to date"
            exit 0
          fi
          branch="info-schema-html-${GITHUB_SHA::8}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "build info schema HTML for ${GITHUB_SHA::8}"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Build info schema HTML for ${GITHUB_SHA::8}" \
            --body "Generated by \`scripts/build_info_schema.py\` from the raw files merged in ${GITHUB_SHA}. Do not edit by hand."
